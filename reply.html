<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Reply</title>
<style>
:root{--bg:#fffaf5;--card:#ffffff;--ink:#1d2733;--muted:#5b6470;--line:#e3d3c0;--brand:#8a4b12;--brand-ink:#ffffff;--ok:#1b6b3a;--warn-bg:#fff3e0;--warn-ink:#7a3e00;--field:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#14110e;--card:#201b16;--ink:#f3ece4;--muted:#b9aea2;--line:#4a3d30;--brand:#e8a252;--brand-ink:#1b1209;--ok:#6fd39a;--warn-bg:#3a2a14;--warn-ink:#ffd9a3;--field:#14110e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
h1{font-size:22px;line-height:1.2;margin:0 0 6px;word-break:break-word}
.chip{display:inline-block;margin:0 0 12px;padding:4px 12px;border-radius:999px;font-weight:800;font-size:14px;background:var(--brand);color:var(--brand-ink)}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
label{display:block;margin:14px 0 6px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;min-height:150px;padding:12px;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;resize:vertical}
.actions{display:grid;gap:10px;margin-top:14px}
a.btn,button.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:12px 16px;border-radius:14px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:800;font-size:17px;text-decoration:none;cursor:pointer;text-align:center}
a.btn.alt,button.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button.small{min-height:44px;font-size:15px;padding:8px 14px;width:auto}
a.btn:focus-visible,button.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.sec h2{font-size:16px;margin:0 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0}
.val{font-weight:800;word-break:break-all;user-select:text;-webkit-user-select:text}
.warn{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px}
.status{min-height:22px;margin-top:8px;font-weight:700;color:var(--ok)}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <div class="card" id="app" aria-live="polite">
    <p class="muted">Loading…</p>
  </div>
</main>
<noscript><main><div class="card"><h1>Reply</h1><p>This page needs JavaScript to prepare your message. Please use the phone number or email printed on your quote or invoice instead.</p></div></main></noscript>
<script>
(function () {
  'use strict';
  /* Reply page for Paint Project Manager quotes and change orders.
     Everything it needs is in the part of the web address after the "#". Browsers never send that part to a
     server, so this page cannot see, store, or forward the reply. It only opens the visitor's OWN text or email app.
     No scripts, fonts, images, analytics, or cookies are loaded from anywhere. */
  window.addEventListener('hashchange', function () { location.reload(); });
  var app = document.getElementById('app');
  var raw = (location.hash || '').replace(/^#/, '');
  var q = new URLSearchParams(raw);
  function take(k, n) { return String(q.get(k) || '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').slice(0, n); }

  var biz = take('n', 80), action = take('a', 60), subject = take('s', 160), body = take('b', 1200);
  var phone = take('p', 20).replace(/\D/g, ''), email = take('e', 120).trim();
  var phoneOk = /^\d{10,15}$/.test(phone);
  var emailOk = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(email);

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmtPhone(d) { return d.length === 10 ? '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6) : (d.length === 11 && d.charAt(0) === '1' ? '+1 (' + d.slice(1, 4) + ') ' + d.slice(4, 7) + '-' + d.slice(7) : '+' + d); }
  function smsHref(m) { return 'sms:' + phone + '?&body=' + encodeURIComponent(m); }
  function mailHref(m) { return 'mailto:' + email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(m); }

  if (biz) document.title = 'Reply to ' + biz;

  if ((!phoneOk && !emailOk) || !body) {
    app.textContent = '';
    app.appendChild(el('h1', '', 'This reply link is incomplete'));
    app.appendChild(el('p', '', 'Open the quote or invoice PDF again and tap one of the reply buttons. Some apps shorten links when you share them.'));
    app.appendChild(el('p', 'muted', 'You can always reply using the phone number or email printed on the PDF.'));
    return;
  }

  app.textContent = '';
  app.appendChild(el('h1', '', biz ? 'Reply to ' + biz : 'Reply'));
  if (action) app.appendChild(el('div', 'chip', action));
  app.appendChild(el('p', '', 'Your message is ready. Change it if you like, then choose how to send it.'));

  var lbl = el('label', '', 'Your message'); lbl.setAttribute('for', 'msg'); app.appendChild(lbl);
  var ta = el('textarea'); ta.id = 'msg'; ta.value = body; ta.setAttribute('autocomplete', 'off'); app.appendChild(ta);

  var actions = el('div', 'actions'); app.appendChild(actions);
  var aSms = null, aMail = null;
  if (phoneOk) { aSms = el('a', 'btn', 'Send as text message'); aSms.href = smsHref(body); actions.appendChild(aSms); }
  if (emailOk) { aMail = el('a', phoneOk ? 'btn alt' : 'btn', 'Send as email'); aMail.href = mailHref(body); actions.appendChild(aMail); }

  function refresh() { var m = ta.value; if (aSms) aSms.href = smsHref(m); if (aMail) aMail.href = mailHref(m); }
  ta.addEventListener('input', refresh);
  ta.addEventListener('change', refresh);

  app.appendChild(el('p', 'muted', 'Nothing is sent from this page. A button opens your own text or email app with the message ready, and nothing goes out until you press Send there.'));

  /* plain-text fallback for phones and computers that will not open a text or email app */
  var sec = el('div', 'sec'); app.appendChild(sec);
  sec.appendChild(el('h2', '', 'Button not working?'));
  sec.appendChild(el('p', 'muted', 'Computers often cannot open text messages, and some phones open a web mail page instead. You can send the message yourself:'));
  var status = el('div', 'status'); status.setAttribute('role', 'status');

  function copy(text) {
    function done(ok) { status.textContent = ok ? 'Copied.' : 'Could not copy. Press and hold the text to select it.'; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { done(true); }, function () { legacy(); }); return; }
    } catch (e) { }
    legacy();
    function legacy() {
      var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) { } t.remove(); done(ok);
    }
  }
  function line(label, value, copyText) {
    var r = el('div', 'row'); var left = el('div'); left.appendChild(el('div', 'muted', label)); left.appendChild(el('div', 'val', value)); r.appendChild(left);
    var b = el('button', 'btn alt small', 'Copy'); b.type = 'button'; b.setAttribute('aria-label', 'Copy ' + label.toLowerCase());
    b.addEventListener('click', function () { copy(copyText != null ? copyText : value); }); r.appendChild(b); sec.appendChild(r);
  }
  if (phoneOk) line('Text this number', fmtPhone(phone), phone);
  if (emailOk) line('Or email this address', email, email);
  var rm = el('div', 'row'); rm.appendChild(el('div', 'muted', 'The message')); var bm = el('button', 'btn alt small', 'Copy message'); bm.type = 'button';
  bm.addEventListener('click', function () { copy(ta.value); }); rm.appendChild(bm); sec.appendChild(rm);
  sec.appendChild(status);

  app.appendChild(el('div', 'warn', 'Only use this page if the business sent you this quote or invoice. It will send your reply to the number or email shown above.'));
})();
</script>
</body>
</html>
